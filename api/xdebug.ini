xdebug.mode=trace
; 注意: start_with_request=yes は CLI（composer/artisan serve 自身）までトレースして
; 起動激遅＋巨大なゴミトレースを生むため使わない。トリガーは web/ 側の fetch URL に付与している。
xdebug.start_with_request=trigger
xdebug.trigger_value=GO
xdebug.trace_format=1
xdebug.use_compression=false
xdebug.output_dir=/var/www/.xdebug-trace
; 1リクエスト=1ファイルにする（既定の trace.%c は毎回同名で上書きされ、旅の再生ができない）
xdebug.trace_output_name=trace.%t