xdebug.mode=trace
; fpm構成では全リクエスト記録（手法1）を採用できる:
; - CLI（composer/artisan）は entrypoint-fpm.sh 側で XDEBUG_MODE=off にして除外
; - fpmマスターはPHPスクリプトではないので artisan serve のような常駐トレースも発生しない
xdebug.start_with_request=yes
xdebug.trace_format=1
xdebug.use_compression=false
xdebug.output_dir=/var/www/.xdebug-trace
xdebug.trace_output_name=trace.%t
