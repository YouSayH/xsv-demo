# nginx + php-fpm（マルチワーカー）構成。artisan serve 版（docker-compose.yml）と排他利用:
#   docker compose down
#   docker compose -f docker-compose.fpm.yml up -d --build
# ホストポートは artisan serve 版と同じ 8080 なので、web/（Next.js）側は無変更で切り替えられる。
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.fpm
    volumes:
      - ./api:/var/www
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
